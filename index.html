<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹿溪衛浴 · 內部知識問答</title>
<meta name="description" content="鹿溪衛浴（虛構）內部知識庫問答機器人 — Groq API，單頁 HTML，知識庫為 knowledge.md">
<style>
:root{--ink:#1c2430;--body:#475569;--line:#e4e8ee;--accent:#0e7490;--accent2:#155e75;--soft:#e0f2f1;--warn:#b45309;--warnbg:#fef3c7;--bg:#f6f8fa;--card:#fff;--muted:#8a94a6;--user:#0e7490;--radius:14px}
@media (prefers-color-scheme:dark){:root{--ink:#e6e9ef;--body:#b6c0cf;--line:#2c3648;--accent:#38bdf8;--accent2:#7dd3fc;--soft:#0f3a44;--warn:#fbbf24;--warnbg:#3a2e10;--bg:#0d1420;--card:#141d2e;--muted:#64748b;--user:#0c4a6e}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.65 "Noto Sans TC","PingFang TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:1.02rem;margin:0;font-weight:800}
.htxt .d{font-size:.76rem;color:var(--muted)}
.modelsel{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:.3rem .4rem;background:var(--card);color:var(--ink);max-width:180px}
.hctrl{display:flex;gap:8px;align-items:center}
.keybtn{font:inherit;font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:.32rem .7rem;background:var(--card);color:var(--accent);cursor:pointer;white-space:nowrap}
.keybtn:hover{border-color:var(--accent)}
@media (max-width:640px){
  header{flex-wrap:wrap;gap:8px;padding:10px 14px}
  .htxt{flex:1 1 auto;min-width:0}
  .htxt .d{font-size:.7rem}
  .hctrl{flex:1 1 100%;justify-content:stretch}
  .hctrl .modelsel{flex:1;max-width:none;min-width:0}
  #chat{padding:16px 12px}
  .msg{max-width:100%}
  footer{padding:10px 12px 14px}
}
#chat{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.wrap{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.msg.me .av{background:linear-gradient(135deg,#64748b,#94a3b8)}
.bub{border-radius:var(--radius);padding:.65rem .95rem;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.msg.ai .bub{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me .bub{background:var(--user);color:#fff;border-top-right-radius:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem}
.badge{font-size:.68rem;font-weight:700;padding:.08rem .5rem;border-radius:999px;background:var(--soft);color:var(--accent2);border:1px solid transparent}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.dots{display:inline-flex;gap:5px;padding:.4rem 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--card);color:var(--body);border-radius:999px;padding:.4rem .85rem;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.error-bub{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
@media (prefers-color-scheme:dark){.error-bub{background:#3b1212;color:#fca5a5;border-color:#7f1d1d}}
footer{border-top:1px solid var(--line);background:var(--card);padding:12px 18px 16px}
.inwrap{max-width:820px;margin:0 auto}
.inrow{display:flex;gap:10px;align-items:flex-end}
.inrow textarea{flex:1;resize:none;font:inherit;font-size:.94rem;padding:.6rem .85rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px;max-height:140px;outline:none;transition:border .15s}
.inrow textarea:focus{border-color:var(--accent)}
.send{font:inherit;font-weight:800;border:0;border-radius:12px;padding:.6rem 1.15rem;background:var(--accent);color:#fff;cursor:pointer}
.send[disabled]{opacity:.45;cursor:not-allowed}
.foot-note{text-align:center;font-size:.72rem;color:var(--muted);margin-top:.55rem}
/* 金鑰閘門 */
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
.gcard{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 30px 24px;box-shadow:0 20px 60px rgba(10,20,40,.08)}
.gcard .logo{width:52px;height:52px;font-size:19px;margin-bottom:14px}
.gcard h2{margin:0 0 .3rem;font-size:1.25rem}
.gcard p{margin:.2rem 0 1rem;font-size:.87rem;color:var(--body)}
.gcard input{width:100%;font:inherit;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:.5rem}
.gcard input:focus{border-color:var(--accent)}
.gerr{color:#dc2626;font-size:.82rem;min-height:1.2em;margin:.2rem 0 .5rem}
.gbtn{width:100%;font:inherit;font-weight:800;padding:.65rem;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-size:.95rem}
.gbtn[disabled]{opacity:.5}
.gnote{font-size:.74rem;color:var(--muted);margin-top:.9rem;line-height:1.5}
.gnote a{color:var(--accent)}
</style>
</head>
<body>

<div id="gate">
  <div class="gcard">
    <div class="logo">鹿</div>
    <h2>鹿溪衛浴 · 內部知識問答</h2>
    <p>請貼上你的 <b>Groq API Key</b>（gsk_ 開頭）開始使用。金鑰只存在這台瀏覽器的 localStorage，不會被傳到其他地方，也不會寫進程式碼。</p>
    <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off">
    <div class="gerr" id="gerr"></div>
    <button class="gbtn" id="gobtn">驗證並開始</button>
    <div class="gnote">沒有金鑰？到 <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> 免費申請。<br>這是內部練習工具，知識庫內容全部是虛構的。</div>
  </div>
</div>

<header>
  <div class="logo">鹿</div>
  <div class="htxt"><h1>鹿溪衛浴 · 內部知識問答</h1><div class="d" id="kbstatus">知識庫載入中…</div></div>
  <div class="hctrl">
    <select class="modelsel" id="model"><option>模型載入中…</option></select>
    <button class="keybtn" id="clearKey" title="清除本機金鑰">更換金鑰</button>
  </div>
</header>

<div id="chat"><div class="wrap" id="feed"></div></div>

<footer>
  <div class="inwrap">
    <div class="chips" id="chips"></div>
    <div class="inrow" style="margin-top:10px">
      <textarea id="input" rows="1" placeholder="問我知識庫裡的事…（Enter 送出，Shift+Enter 換行）"></textarea>
      <button class="send" id="send">送出</button>
    </div>
    <div class="foot-note">只依據 knowledge.md 回答，不編造。2024 版新人須知已停用，規定一律以 2026 版為準。</div>
  </div>
</footer>

<script>
const GROQ = 'https://api.groq.com/openai/v1/chat/completions';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&'+'amp;','<':'&'+'lt;','>':'&'+'gt;','"':'&'+'quot;'}[c]));
let KEY = null, HISTORY = [], BUSY = false;
let KB = [], KB_READY = false, KB_ERR = null, SYSTEM_PROMPT = '';

/* ── 知識庫：執行時抓取 knowledge.md（?t= 避開快取，改檔即生效） ── */
async function loadKB(){
  const res = await fetch('knowledge.md?t=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  KB = parseKB(text);
  if (!KB.length) throw new Error('knowledge.md 解析不到任何「## 文件：」區塊');
  SYSTEM_PROMPT = buildSystem();
  KB_READY = true;
  $('#kbstatus').textContent = '知識庫已載入：' + KB.length + ' 份文件　｜　資料為虛構';
}
function parseKB(text){
  const out = [];
  text.split(/^## 文件：/m).slice(1).forEach(p => {
    const nl = p.indexOf('\n');
    const head = p.slice(0, nl).trim();
    const body = p.slice(nl + 1).trim();
    const m = head.match(/^(.+?\.md)（(.+)）$/);
    if (m && body) out.push({ file: m[1].trim(), status: m[2].trim(), text: body });
  });
  return out;
}
function buildSystem(){
  return `你是「鹿溪衛浴（虛構）」的內部知識問答助理，服務對象是公司同仁。一律用繁體中文回答。

規則：
1. 答案只能根據下方知識庫。知識庫沒有的資訊，明確說「知識庫裡沒有這項資訊」，絕對不要編造或用常識補。
2. 「新人須知_2024版_已停用」已停用。任何規定若與 2026 版不同，一律以 2026 版回答，並提醒對方 2024 版已停用（例：有人用 9 折權限或 7 天退貨問你，要糾正成 95 折與 14 天）。
3. 產品母稿標【不可對外】的內容，可以告訴內部同仁，但回答結尾必須加一行「⚠️ 內部資訊，不可對外」。
4. 回答最後單獨一行寫「依據：<用到的文件名，逗號分隔，不含 .md>」。
5. 簡潔、條列清楚、語氣專業友善。數字要照知識庫原文，不要四捨五入或自己補。

【知識庫開始】
` + KB.map(k => `### 文件：${k.file}（${k.status}）\n${k.text}`).join('\n\n') + `
【知識庫結束】`;
}
loadKB().catch(e => { KB_ERR = e.message; $('#kbstatus').textContent = '知識庫載入失敗：' + e.message; });

/* ── 金鑰閘門 ── */
async function verifyKey(k){
  const r = await fetch(GROQ.replace('/chat/completions','/models'), { headers: { Authorization: 'Bearer ' + k } });
  if (r.status === 401) throw new Error('金鑰無效（401）。請確認是 Groq 的 API Key，gsk_ 開頭。');
  if (!r.ok) throw new Error('Groq 回應 ' + r.status + '，稍後再試。');
  const j = await r.json();
  populateModels(j.data || []);
  return true;
}
function populateModels(list){
  const skip = /whisper|tts|guard|embed|prompt|distil/i;
  const ids = list.map(m => m.id).filter(id => !skip.test(id)).sort();
  if (!ids.length) return;
  const saved = localStorage.getItem('lx_groq_model');
  const cur = (saved && ids.includes(saved)) ? saved :
    (ids.find(i => /llama-3\.3.*70b/i.test(i)) || ids.find(i => /70b/i.test(i)) || ids.find(i => /gpt-oss/i.test(i)) || ids[0]);
  $('#model').innerHTML = ids.map(id => `<option value="${esc(id)}"${id === cur ? ' selected' : ''}>${esc(id)}</option>`).join('');
  localStorage.setItem('lx_groq_model', cur);
}
$('#model').addEventListener('change', () => localStorage.setItem('lx_groq_model', $('#model').value));
$('#gobtn').onclick = async () => {
  const k = $('#keyInput').value.trim();
  const err = $('#gerr');
  if (!k){ err.textContent = '請先貼上金鑰'; return; }
  $('#gobtn').disabled = true; err.textContent = '驗證中…';
  try {
    await verifyKey(k);
    KEY = k; localStorage.setItem('lx_groq_key', k);
    $('#gate').style.display = 'none';
    hello();
  } catch (e) {
    err.textContent = e.message;
  }
  $('#gobtn').disabled = false;
};
$('#keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#gobtn').click(); });
$('#clearKey').onclick = () => {
  localStorage.removeItem('lx_groq_key'); KEY = null; HISTORY = [];
  $('#feed').innerHTML = ''; $('#gate').style.display = 'grid';
  $('#keyInput').value = ''; $('#gerr').textContent = '';
};

/* ── 聊天 ── */
function bubble(role, html, meta){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
  div.innerHTML = `<div class="av">${role === 'user' ? '你' : '鹿'}</div><div class="bub">${html}${meta || ''}</div>`;
  $('#feed').appendChild(div);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return div;
}
function typing(){
  const d = bubble('ai', '<span class="dots"><i></i><i></i><i></i></span>');
  d.querySelector('.bub').id = 'typing';
  return d;
}
function hello(){
  bubble('ai', esc('你好，我是鹿溪衛浴的內部知識問答助理。公司規定、報價、退換貨、產品規格的問題都可以問我。我只根據知識庫回答，知識庫沒有的我會直說。'));
  drawChips();
}
const CHIPS = ['一般詢問要多久回覆？客訴呢？','業務報價最多可以打幾折？','退貨期限是幾天？哪些情況不能退？','海外報價要誰核准？','LX-350 有沒有 WRAS 認證？','閥芯壽命可以對外說多少？','客訴回覆的三段式是什麼？'];
function drawChips(){
  $('#chips').innerHTML = CHIPS.map(c => `<button class="chip">${esc(c)}</button>`).join('');
}
$('#chips').addEventListener('click', e => {
  if (e.target.classList.contains('chip')){ $('#input').value = e.target.textContent; send(); }
});
function renderMeta(meta){
  if (!meta) return '';
  const b = (t, cls) => `<span class="badge ${cls || ''}">${esc(t)}</span>`;
  let h = '<div class="meta">';
  if (meta.sources && meta.sources.length) h += meta.sources.map(s => b('依據：' + s)).join('');
  if (meta.internal) h += b('⚠️ 內部資訊，不可對外', 'warn');
  return h + '</div>';
}
function parseTail(text){
  let internal = false, sources = [];
  let body = text;
  const m = body.match(/依據[:：]\s*([^\n]+)\s*$/);
  if (m){
    sources = m[1].split(/[，,、]/).map(s => s.trim().replace(/\.md$/i, '')).filter(Boolean);
    body = body.slice(0, m.index).trim();
  }
  if (/內部資訊，不可對外/.test(body)){ internal = true; body = body.replace(/⚠?️?\s*內部資訊，不可對外/g, '').trim(); }
  return { body, sources, internal };
}
async function send(){
  if (BUSY) return;
  if (!KB_READY){
    bubble('ai', esc(KB_ERR ? '知識庫載入失敗：' + KB_ERR + '（重新整理頁面再試）' : '知識庫還在載入，幾秒後再送一次。'), '<div class="meta"><span class="badge warn">錯誤</span></div>');
    return;
  }
  const q = $('#input').value.trim();
  if (!q) return;
  $('#input').value = ''; $('#input').style.height = 'auto';
  BUSY = true; $('#send').disabled = true;
  bubble('user', esc(q));
  const tip = typing();
  try {
    const messages = [{ role: 'system', content: SYSTEM_PROMPT },
      ...HISTORY.slice(-8),
      { role: 'user', content: q }];
    const res = await fetch(GROQ, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY },
      body: JSON.stringify({ model: $('#model').value, messages, temperature: 0.2, max_tokens: 1200 })
    });
    const j = await res.json().catch(() => ({}));
    if (res.status === 401){
      tip.remove();
      localStorage.removeItem('lx_groq_key'); KEY = null;
      bubble('ai', esc('金鑰失效（401）。請按右上「更換金鑰」重新輸入。'), '');
      throw new Error('401');
    }
    if (!res.ok) throw new Error((j.error && j.error.message) || ('Groq 回應 ' + res.status));
    const text = (j.choices && j.choices[0] && j.choices[0].message.content || '').trim() || '（模型沒有回覆內容）';
    const { body, sources, internal } = parseTail(text);
    HISTORY.push({ role: 'user', content: q }, { role: 'assistant', content: text });
    tip.remove();
    bubble('ai', esc(body), renderMeta({ sources, internal }));
  } catch (e) {
    tip.remove();
    if (String(e.message).includes('Failed to fetch')) bubble('ai', '連不上 Groq（網路或防火牆）。', '<div class="meta"><span class="badge warn">錯誤</span></div>');
    else bubble('ai', esc(e.message), '<div class="meta"><span class="badge warn">錯誤</span></div>');
  }
  BUSY = false; $('#send').disabled = false;
  $('#input').focus();
}
$('#send').onclick = send;
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('#input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px';
});

/* ── 啟動 ── */
const saved = localStorage.getItem('lx_groq_key');
if (saved){
  KEY = saved;
  $('#gate').style.display = 'none';
  hello();
  /* 已存金鑰：靜默抓一次模型清單，讓下拉選單保持最新 */
  fetch(GROQ.replace('/chat/completions','/models'), { headers: { Authorization: 'Bearer ' + KEY } })
    .then(r => r.json()).then(j => populateModels(j.data || [])).catch(() => {});
}
</script>
